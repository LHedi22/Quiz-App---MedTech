name: CI

on:
  push:
  pull_request:

env:
  # This project's test suites are real integration tests against a live
  # Supabase + backend stack, by design (no mocks - see docs/PROGRESS.md).
  # These are the fixed local-dev demo keys `supabase start` always issues
  # for this repo's backend/supabase/config.toml (no custom jwt_secret
  # configured) - not real secrets, and already hardcoded as the same
  # fallback defaults throughout backend/tests/test_rls_cross_user.py,
  # mobile/lib/config.dart, and web/.env.local.example's local dev values.
  LOCAL_SUPABASE_URL: http://127.0.0.1:54341
  LOCAL_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  LOCAL_SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
  LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54342/postgres
  LOCAL_BACKEND_URL: http://127.0.0.1:8000
  # supabase start's full default set is [analytics,db,edge-runtime,functions,
  # imgproxy,inbucket,kong,meta,realtime,rest,storage,studio,vector] - this
  # project uses none of analytics/edge-runtime/functions/imgproxy/inbucket/
  # realtime/studio/vector, so excluding them cuts CI image-pull time
  # significantly without dropping anything the tests actually exercise
  # (db/kong/meta/rest/storage stay, since RLS-over-PostgREST and Storage
  # PDF tests both need them).
  SUPABASE_EXCLUDE: analytics,edge-runtime,functions,imgproxy,inbucket,realtime,studio,vector

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install system dependencies (pyzbar needs libzbar)
        run: sudo apt-get update && sudo apt-get install -y libzbar0
      - run: pip install -e ".[dev]"
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
      - name: Start local Supabase stack
        run: supabase start --exclude "$SUPABASE_EXCLUDE"
      - name: Apply migrations
        run: python migrations/apply_migrations.py
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
      - run: ruff check app tests
      - run: black --check app tests
      - run: pytest
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.LOCAL_SUPABASE_SERVICE_ROLE_KEY }}

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install system dependencies (pyzbar needs libzbar)
        run: sudo apt-get update && sudo apt-get install -y libzbar0
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
      - name: Start local Supabase stack
        working-directory: backend
        run: supabase start --exclude "$SUPABASE_EXCLUDE"
      - name: Apply migrations
        working-directory: backend
        run: python migrations/apply_migrations.py
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
      - name: Start backend server
        working-directory: backend
        # Mobile's Phase 8.4 batch-summary test creates a real quiz/version
        # via raw HTTP against this server (mirrors the login flow test's own
        # real-Supabase-Auth-only path, which needs no backend). nohup+disown
        # so the process survives past this step, for the flutter test step
        # below; a bounded curl retry loop confirms it's actually healthy
        # before moving on rather than racing it.
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../uvicorn.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "backend never became healthy"; cat ../uvicorn.log; exit 1
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      # lib/config.dart's String.fromEnvironment defaults already match the
      # local stack exactly, but --dart-define is passed explicitly anyway -
      # Dart only reads compile-time --dart-define flags, not OS env vars,
      # so relying on the defaults matching by coincidence would be fragile.
      - run: >
          flutter test
          --dart-define=SUPABASE_URL=${{ env.LOCAL_SUPABASE_URL }}
          --dart-define=BACKEND_URL=${{ env.LOCAL_BACKEND_URL }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install system dependencies (pyzbar needs libzbar)
        run: sudo apt-get update && sudo apt-get install -y libzbar0
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
      - name: Start local Supabase stack
        working-directory: backend
        run: supabase start --exclude "$SUPABASE_EXCLUDE"
      - name: Apply migrations
        working-directory: backend
        run: python migrations/apply_migrations.py
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
      - name: Start backend server
        working-directory: backend
        # e2e/pythonRegression.ts shells out to this same backend for the one
        # step with no web UI equivalent (scanning is mobile-only); most
        # other web specs hit it through lib/api/client.ts. Same nohup+disown
        # +health-poll pattern as the mobile job.
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../uvicorn.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "backend never became healthy"; cat ../uvicorn.log; exit 1
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ env.LOCAL_BACKEND_URL }}
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_BASE_URL: ${{ env.LOCAL_BACKEND_URL }}
