[project]
name = "exam-scanner-backend"
version = "0.1.0"
description = "FastAPI backend for the exam version generator & scanner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "qrcode[pil]>=7.4",
    "reportlab>=4.0",
    "pyzbar>=0.1.9",
    "PyMuPDF>=1.24",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "joblib>=1.3",
    "pyjwt[crypto]>=2.9",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.5",
    "rust-just>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
